[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
thockflow = { path = ".." }

axum = "0.5"
clap = { version = "3.2.25", features = ["derive"] }
env_logger = "0.9"
hyper = { version = "0.14", features = ["full"] }
log = "0.4"
num_cpus = "1.17"
once_cell = "1.21"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.4", features = ["make"] }
tower-http = { version = "0.3", features = ["fs"] }
anyhow = "1.0.102"
axum-extra = { version = "0.3.7", features = ["spa"] }
yew = { version = "0.21", features = ["ssr"] }
yew-router = { version = "0.18" }
futures = "0.3.32"
lazy_static = "1.5.0"
lambda-web = { version = "0.2.1", features = ["hyper"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25"
tree-sitter-devicetree = "0.15"
tree-sitter-scheme = "0.24.7"
kanata-parser = "0.1100.0"
regex = "1"
runfiles = { version = "0.1", optional = true }
roxmltree = "0.20"

[features]
default = []
runfiles = ["dep:runfiles"]

[dev-dependencies]
tempfile = "3.27"
