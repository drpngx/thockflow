services:
  thockflow:
    container_name: thockflow
    image: localhost/thockflow:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    environment:
      # Bind by container name, not a pinned container IP: podman 4.9 leaks the
      # IPAM lease when a container dies mid-start, and a pinned address then
      # collides with the dead lease on every restart until /run clears. The
      # server resolves "thockflow" via aardvark DNS to its own current address,
      # so the bind stays scoped to this interface. Only cloudflared can reach it
      # -- the network is internal-only.
      - HTTP_LISTEN_ADDR=thockflow:8080
    networks:
      - thockflow_internal

  cloudflared:
    container_name: cloudflared-thockflow
    image: localhost/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_THOCKFLOW}
    networks:
      - thockflow_external
      - thockflow_internal
    labels:
      # Image is built locally, not pulled: "registry" made podman auto-update fail
      # with "pinging container registry localhost: connection refused".
      - "io.containers.autoupdate=local"
    depends_on:
      - thockflow

networks:
  thockflow_internal:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.1.0/24
  thockflow_external:
    driver: bridge
