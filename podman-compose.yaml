services:
  thockflow:
    container_name: thockflow
    image: localhost/thockflow:latest
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    environment:
      - HTTP_LISTEN_ADDR=10.89.1.5:8080
    networks:
      thockflow_internal:
        ipv4_address: 10.89.1.5

  cloudflared:
    container_name: cloudflared-thockflow
    image: localhost/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_THOCKFLOW}
    networks:
      - thockflow_external
      - thockflow_internal
    labels:
      # Image is built locally, not pulled: "registry" made podman auto-update fail
      # with "pinging container registry localhost: connection refused".
      - "io.containers.autoupdate=local"
    depends_on:
      - thockflow

networks:
  thockflow_internal:
    internal: true
    driver: bridge
    ipam:
      config:
        - subnet: 10.89.1.0/24
  thockflow_external:
    driver: bridge
